MaintainerNotes: |
  Source builds do not require a local signing keystore: assembleRelease stays
  unsigned when signing properties are absent, so F-Droid can rebuild and sign it.
  Direct GitHub release APKs use a separate dedicated release key, so users
  switching between GitHub and F-Droid builds must uninstall the other one first.
  The app uses an accessibility service and optional device admin; both are granted
  by the user from OwnFate's own screens. Screenshots and full descriptions live in
  fastlane/metadata/android/en-US/.
  The four bundled Inter TTF files in app/src/main/res/font/ are OFL-1.1 licensed;
  if the source scanner flags them, add app/src/main/res/font/ to scanignore.

